name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CONVERTER_IMAGE: ghcr.io/${{ github.repository_owner }}/kripke-converter
  PIPELINE_IMAGE: ghcr.io/${{ github.repository_owner }}/kripke-pipeline
  NUXMV_IMAGE: ghcr.io/${{ github.repository_owner }}/nuxmv:2.2.0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema

      - name: schema self-check
        run: python3 -m json.tool schemas/kripke.schema.json > /dev/null

      - name: validate every example
        run: |
          fail=0
          for f in examples/*.json; do
            python3 scripts/validate_model.py "$f" || fail=1
          done
          exit $fail

      # A validator that never rejects anything is worthless, so prove it
      # still bites. Each of these must exit 1.
      - name: negative cases
        run: |
          mkdir -p /tmp/kt
          cat > /tmp/kt/dead.json <<'EOF'
          {"states":["s0","s1"],"initial_states":["s0"],
           "transitions":[["s0","s1"]],
           "state_predicates":[{"state":"s0","predicates":["p"]},
                               {"state":"s1","predicates":[]}]}
          EOF
          cat > /tmp/kt/empty_init.json <<'EOF'
          {"states":["s0"],"initial_states":[],"transitions":[["s0","s0"]],
           "state_predicates":[{"state":"s0","predicates":[]}]}
          EOF
          cat > /tmp/kt/inject.json <<'EOF'
          {"states":["s0","x}; MODULE evil"],"initial_states":["s0"],
           "transitions":[["s0","s0"]],
           "state_predicates":[{"state":"s0","predicates":[]}]}
          EOF
          fail=0
          for f in /tmp/kt/*.json; do
            if python3 scripts/validate_model.py "$f" 2>/dev/null; then
              echo "::error::validator accepted $f but should have rejected it"
              fail=1
            else
              echo "correctly rejected $(basename "$f")"
            fi
          done
          exit $fail

  lint-dockerfiles:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          dockerfile: docker/*.Dockerfile

  build:
    name: build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc,          cxx: g++,     flags: "" }
          - { name: clang,        cxx: clang++, flags: "" }
          # libc++ orders its containers independently of libstdc++. If the
          # generator ever leaks container iteration order into the emitted
          # SMV again, this is the job that catches it.
          - { name: clang-libc++, cxx: clang++, flags: "-stdlib=libc++" }
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain
        if: startsWith(matrix.name, 'clang')
        run: sudo apt-get update && sudo apt-get install -y clang libc++-dev libc++abi-dev

      - name: configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"

      - name: build
        run: cmake --build build -j"$(nproc)"

      - name: golden tests
        run: ctest --test-dir build --output-on-failure

      - name: converter exit codes
        run: |
          fail=0
          expect_exit() {
            local want="$1"; shift
            local rc=0
            "$@" >/dev/null 2>&1 || rc=$?
            if [ "$rc" -ne "$want" ]; then
              echo "::error::$* gave exit $rc, expected $want"
              fail=1
            else
              echo "ok: exit $rc from $*"
            fi
          }
          printf 'not json' > /tmp/notjson.json
          printf '{}'       > /tmp/empty.json
          # 1 = rejected cleanly; 139/134 would mean segfault/abort
          expect_exit 1 ./build/kripke_generator /tmp/notjson.json /tmp/out.smv
          expect_exit 1 ./build/kripke_generator /tmp/empty.json   /tmp/out.smv
          expect_exit 2 ./build/kripke_generator /tmp/nope.json    /tmp/out.smv
          expect_exit 0 ./build/kripke_generator examples/K_GBN_fixed.json /tmp/out.smv
          exit $fail

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smv-${{ matrix.name }}
          path: build/*.smv
          retention-days: 7

  images:
    name: build images
    needs: [validate, build, lint-dockerfiles]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # Pushed even on pull requests: the e2e job runs in this image and can
      # only pull it from the registry. Only main moves the `latest` tag.
      - name: converter image (public)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/converter.Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.CONVERTER_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.CONVERTER_IMAGE) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pulls the private nuXmv base, which must grant this repository read
      # access under the package's "Manage Actions access" settings.
      - name: pipeline image (private, contains nuXmv)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/pipeline.Dockerfile
          push: true
          provenance: false
          build-args: |
            NUXMV_IMAGE=${{ env.NUXMV_IMAGE }}
            CONVERTER_IMAGE=${{ env.CONVERTER_IMAGE }}:${{ steps.meta.outputs.tag }}
          tags: |
            ${{ env.PIPELINE_IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.PIPELINE_IMAGE) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: e2e ${{ matrix.model }}
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/kripke-pipeline:${{ needs.images.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # actions/checkout needs to write into the workspace; the image runs
      # as uid 10001 by default.
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        model: [K_GBN_fixed, K_Karn_v2, K_RTO_v2]
    steps:
      - uses: actions/checkout@v4

      - name: validate, convert, model-check
        run: /opt/pipeline/scripts/run_pipeline.sh "examples/${{ matrix.model }}.json" out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.model }}
          path: out/
          retention-days: 14
